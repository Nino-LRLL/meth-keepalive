name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tests:
    name: Tests (Windows + Linux)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile check (all sources)
        run: python -m compileall -q src run.py

  release-windows:
    name: Build portable exe + GitHub Release
    runs-on: windows-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm Meth.spec

      - name: Create release archive + SHA256
        shell: bash
        run: |
          mkdir -p release
          cd dist
          powershell -Command "Compress-Archive -Path Meth -DestinationPath ../release/Meth-Portable.zip -Force"
          cd ../release
          powershell -Command "Get-FileHash Meth-Portable.zip -Algorithm SHA256 | Select-Object -ExpandProperty Hash" > SHA256.txt
          cat SHA256.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Meth-Portable.zip
            release/SHA256.txt
          generate_release_notes: true
