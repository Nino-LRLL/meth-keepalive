name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tests:
    name: Tests (Windows + Linux)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test

  release-windows:
    name: Build portable exe + GitHub Release
    runs-on: windows-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Create release archive + SHA256
        shell: bash
        run: |
          mkdir -p release
          cp target/release/meth.exe release/Meth.exe
          cd release
          powershell -Command "Compress-Archive -Path Meth.exe -DestinationPath Meth-Portable.zip -Force"
          powershell -Command "Get-FileHash Meth-Portable.zip -Algorithm SHA256 | Select-Object -ExpandProperty Hash" > SHA256.txt
          cat SHA256.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Meth-Portable.zip
            release/SHA256.txt
          generate_release_notes: true
