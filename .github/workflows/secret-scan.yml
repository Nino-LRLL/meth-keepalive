name: secret-scan

# Règle absolue du compte : jamais de secret dans un repo public.
# Scan gitleaks (outil standard, gratuit) — casse le build si une clé est
# détectée, même si elle est passée à travers un hook local.
#
# Déclencheurs :
#   - push (toutes branches) + pull requests
#   - workflow_dispatch (relance manuelle)
#   - tous les dimanches 04:00 (rattrape les fuites passées)

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : gitleaks scanne les commits passés, pas
          # seulement le dernier (une clé supprimée reste dans l'historique).
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          # Token par défaut de l'action (lecture seule, jamais un secret
          # utilisateur) — ne contient AUCUNE clé.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
