name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test

      - name: Check no warnings
        run: cargo build

  build-reactos:
    name: Cross-build ReactOS (MinGW Win32)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install MinGW cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Add windows-gnu target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Cross-build for ReactOS
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Upload ReactOS binary
        uses: actions/upload-artifact@v4
        with:
          name: meth-reactos.exe
          path: target/x86_64-pc-windows-gnu/release/meth.exe

  build-windows:
    name: Build portable exe (Windows)
    runs-on: windows-latest
    needs: tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Create release archive + SHA256
        shell: bash
        run: |
          mkdir -p release
          cp target/release/meth.exe release/Meth.exe
          cd release
          powershell -Command "Compress-Archive -Path Meth.exe -DestinationPath Meth-Portable.zip -Force"
          powershell -Command "Get-FileHash Meth-Portable.zip -Algorithm SHA256 | Select-Object -ExpandProperty Hash" > SHA256.txt
          cat SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Meth-Portable.zip
          path: release/
