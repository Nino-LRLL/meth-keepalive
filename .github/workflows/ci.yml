name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        python-version: [ "3.11" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile check (all sources)
        run: python -m compileall -q src run.py

  build-windows:
    name: Build portable exe (Windows)
    runs-on: windows-latest
    needs: tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm Meth.spec

      - name: Create release archive
        shell: bash
        run: |
          mkdir -p release
          cd dist
          powershell -Command "Compress-Archive -Path Meth -DestinationPath ../release/Meth-Portable.zip -Force"

      - name: Compute SHA256
        shell: bash
        run: |
          cd release
          powershell -Command "Get-FileHash Meth-Portable.zip -Algorithm SHA256 | Select-Object -ExpandProperty Hash" > SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Meth-Portable.zip
          path: release/
