name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test

      - name: Check no warnings
        run: cargo build

  build-windows:
    name: Build portable exe (Windows)
    runs-on: windows-latest
    needs: tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Create release archive + SHA256
        shell: bash
        run: |
          mkdir -p release
          cp target/release/meth.exe release/Meth.exe
          cd release
          powershell -Command "Compress-Archive -Path Meth.exe -DestinationPath Meth-Portable.zip -Force"
          powershell -Command "Get-FileHash Meth-Portable.zip -Algorithm SHA256 | Select-Object -ExpandProperty Hash" > SHA256.txt
          cat SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Meth-Portable.zip
          path: release/
